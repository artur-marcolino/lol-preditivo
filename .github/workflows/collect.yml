name: Coleta de dados

# Quando roda:
#   - todo dia (todas as fontes);
#   - num push em main que mude um coletor (só as fontes alteradas). A mensagem do commit
#     pode pedir fontes explicitamente: "[coleta: lolesports meraki]" ou "[coleta: todas]";
#   - sob demanda (aba Actions > Coleta de dados > Run workflow).
#
# Cada fonte é um job separado, com fila própria (uma fonte lenta não trava as outras) e
# orçamento de tempo próprio. Se a carga histórica não terminar dentro do orçamento, o
# workflow dispara a si mesmo para continuar (até 8 vezes). A decisão de quais fontes rodar
# fica em .github/scripts/plan.py.
on:
  schedule:
    # Dois horários: depois dos jogos da Ásia e depois dos das Américas. Sob carga alta o
    # GitHub pode descartar execuções agendadas; com dois horários uma cobre a outra, e
    # coletar duas vezes não duplica nada (cada arquivo só muda se o conteúdo mudar).
    - cron: "41 9 * * *" # 06:41 em Brasília
    - cron: "27 3 * * *" # 00:27 em Brasília
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/collect.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      sources:
        description: "Fontes separadas por espaço (vazio = todas)"
        default: ""
      full:
        description: "Recoletar tudo, inclusive anos fechados"
        type: boolean
        default: false
      years:
        description: "Só estes anos, separados por espaço (vazio = regra padrão)"
        default: ""
      max_minutes:
        description: "Orçamento de tempo por fonte, em minutos"
        default: "300"
      snapshot:
        description: "Criar também uma release congelada com a data de hoje"
        type: boolean
        default: false
      chain:
        description: "(interno) quantas vezes a carga histórica já se reencadeou"
        default: "0"

permissions:
  contents: write
  actions: write

env:
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  plan:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.sources }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
          RUN_ID: ${{ github.run_id }}
          HAS_PANDASCORE: ${{ secrets.PANDASCORE_TOKEN != '' }}
          HAS_ODDSPAPI: ${{ secrets.ODDSPAPI_KEY != '' }}
          HAS_ESPORTSEARNINGS: ${{ secrets.ESPORTSEARNINGS_KEY != '' }}
        run: python .github/scripts/plan.py >> "$GITHUB_OUTPUT"

  collect:
    needs: [test, plan]
    if: ${{ needs.plan.outputs.sources != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    # fila por fonte: duas coletas da mesma fonte nunca rodam ao mesmo tempo
    concurrency:
      group: coleta-${{ matrix.source }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.plan.outputs.sources) }}
    env:
      LEAGUEPEDIA_USER: ${{ secrets.LEAGUEPEDIA_USER }}
      LEAGUEPEDIA_PASSWORD: ${{ secrets.LEAGUEPEDIA_PASSWORD }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      ESPORTSEARNINGS_KEY: ${{ secrets.ESPORTSEARNINGS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Baixar dados já coletados
        run: lolpred pull --pattern "${{ matrix.source }}__*"

      - name: Coletar
        env:
          FULL: ${{ github.event.inputs.full }}
          YEARS: ${{ github.event.inputs.years }}
          MAX_MINUTES: ${{ github.event.inputs.max_minutes || '300' }}
          CHAIN: ${{ github.event.inputs.chain || '0' }}
        run: |
          args=(collect -s "${{ matrix.source }}" --max-minutes "$MAX_MINUTES")
          [[ "$FULL" == "true" ]] && args+=(--full)
          [[ -n "$YEARS" ]] && args+=(--years $YEARS)
          # rodada de continuação da carga histórica: só completa o que ainda falta
          [[ "$CHAIN" != "0" ]] && args+=(--backfill-only)
          lolpred "${args[@]}"

      - name: Publicar na Release data-latest
        if: ${{ !cancelled() }}
        run: lolpred publish -s "${{ matrix.source }}"

      - name: Versionar manifesto e log
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/manifest/${{ matrix.source }}.json" "data/runs/${{ matrix.source }}.json"
          git diff --cached --quiet && { echo "nada mudou"; exit 0; }
          git commit -m "dados(${{ matrix.source }}): coleta $(date -u +%Y-%m-%d)"
          # o CATALOG.md é regenerado no job finalize; descarta a cópia local antes do rebase
          git checkout -- .
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Resumo
        if: ${{ !cancelled() }}
        run: |
          echo "### ${{ matrix.source }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "data/runs/${{ matrix.source }}.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  finalize:
    needs: [plan, collect]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: coleta-finalize
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Atualizar catálogo
        run: |
          lolpred status > /dev/null
          cat data/CATALOG.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/CATALOG.md
          git diff --cached --quiet || { git commit -m "dados: atualiza catálogo" && git pull --rebase -q && git push -q; }

      # Reconstrói o banco analítico com os dados novos e roda as verificações de
      # integridade/vazamento: se a fonte mudar de formato, o problema aparece aqui.
      - name: Validar banco analítico
        run: |
          lolpred pull
          lolpred build-db > /dev/null
          set -o pipefail
          lolpred check-db | tee -a "$GITHUB_STEP_SUMMARY"

      # Release congelada no dia 1 de cada mês (ou quando pedido), para reprodutibilidade
      - name: Snapshot mensal
        if: ${{ github.event_name == 'schedule' || github.event.inputs.snapshot == 'true' }}
        env:
          FORCE: ${{ github.event.inputs.snapshot }}
        run: |
          if [[ "$FORCE" != "true" && "$(date -u +%d)" != "01" ]]; then echo "hoje não é dia 1"; exit 0; fi
          python -c "from lolpred import release; release.snapshot(release.repo_slug(), 'data-$(date -u +%Y-%m-%d)')"

      # Só considera as fontes coletadas NESTA execução: uma fonte que está rodando em outra
      # execução cuida da própria continuação (senão, execuções vazias se encadeariam à toa).
      - name: Continuar carga histórica
        env:
          CHAIN: ${{ github.event.inputs.chain || '0' }}
          PLANNED: ${{ needs.plan.outputs.sources }}
        run: |
          pending=$(python - <<'EOF'
          import json, os, pathlib
          planned = json.loads(os.environ.get("PLANNED") or "[]")
          pending = []
          for name in planned:
              path = pathlib.Path("data/runs") / f"{name}.json"
              if path.exists() and json.loads(path.read_text()).get("incomplete"):
                  pending.append(name)
          print(" ".join(pending))
          EOF
          )
          if [[ -z "$pending" ]]; then echo "nenhuma fonte pendente"; exit 0; fi
          if (( CHAIN >= 8 )); then echo "::warning::carga ainda pendente em: $pending (limite de reencadeamento atingido)"; exit 0; fi
          echo "pendentes: $pending; disparando nova execução ($((CHAIN + 1))/8)"
          gh workflow run collect.yml --ref main -f sources="$pending" -f chain="$((CHAIN + 1))"
