[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lolpred"
version = "0.1.0"
description = "Coleta reprodutível de dados de LoL competitivo para modelagem preditiva"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lolpred = "lolpred.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
